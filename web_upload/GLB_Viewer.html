<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Animation Pack Viewer — 360°</title>
<meta name="description" content="Interactive 360° viewer for Robin Picture Graphic animation packs.">
<style>
/* ============================================================
   THEME — same palette as PackBoard so the embed matches the site
   ============================================================ */
:root{
  --bg:#12151c; --bg2:#171b24; --panel:#1c2130; --line:#2b3246; --line2:#39415a;
  --tx:#e6eaf3; --tx2:#9aa4bd; --tx3:#6b7590;
  --accent:#5b8dff; --accentq:#5b8dff22;
  --shadow:0 8px 28px rgba(0,0,0,.45);
  --radius:10px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f4f6fa; --bg2:#ffffff; --panel:#ffffff; --line:#e2e6ef; --line2:#cdd4e2;
  --tx:#1b2030; --tx2:#5b6480; --tx3:#8a93ab;
  --accent:#3b6fe0; --accentq:#3b6fe018;
  --shadow:0 8px 28px rgba(20,30,60,.13);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--tx); overflow:hidden;
  font:13.5px/1.45 "Inter","Segoe UI",system-ui,-apple-system,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
select,input{font:inherit;color:inherit}
code,.mono{font-family:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--tx3);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;flex-direction:column;height:100vh}

/* ---------- top bar ---------- */
header.top{
  display:flex;align-items:center;gap:10px;padding:9px 12px;flex:0 0 auto;flex-wrap:wrap;
  background:var(--bg2);border-bottom:1px solid var(--line);
}
.brand{display:flex;align-items:center;gap:9px}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#5b8dff,#a06bff);
  display:grid;place-items:center;font-weight:800;font-size:11px;color:#fff;flex:0 0 auto;letter-spacing:.5px}
.title{font-weight:700;font-size:14.5px;white-space:nowrap}
.sub{color:var(--tx3);font-size:11.5px;white-space:nowrap}
.spacer{flex:1 1 auto}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:7px;
  border:1px solid var(--line2);color:var(--tx2);white-space:nowrap;font-size:12.5px;font-weight:500}
.btn:hover{background:var(--line);color:var(--tx)}
.btn.on{border-color:var(--accent);background:var(--accentq);color:var(--tx)}
.btn.icon{padding:6px 8px;line-height:1}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent);color:#fff}
select.sel{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:6px 9px;
  font-size:12.5px;outline:none;max-width:210px}
select.sel:focus{border-color:var(--accent)}

/* ---------- body ---------- */
main{flex:1 1 auto;display:flex;min-height:0;position:relative}

/* clip list */
aside{
  width:236px;flex:0 0 auto;background:var(--bg2);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
aside .ahead{padding:10px 12px 8px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
aside .ahead h2{margin:0;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--tx3);font-weight:700}
.count{margin-left:auto;font-size:11px;color:var(--tx3);background:var(--bg);border:1px solid var(--line);
  border-radius:20px;padding:1px 8px}
#clipSearch{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:7px;
  padding:6px 9px;outline:none;font-size:12.5px;margin:8px 12px 0;width:calc(100% - 24px)}
#clipSearch:focus{border-color:var(--accent)}
#clipList{overflow:auto;padding:8px;flex:1 1 auto;min-height:0}
.clip{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:7px 9px;border-radius:7px;
  color:var(--tx2);font-size:12.5px;border:1px solid transparent}
.clip:hover{background:var(--line);color:var(--tx)}
.clip.on{background:var(--accentq);border-color:var(--accent);color:var(--tx);font-weight:600}
.clip .nm{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.clip .dur{font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.clip.on .dur{color:var(--tx2)}
.empty{padding:14px 12px;color:var(--tx3);font-size:12px;line-height:1.6}

/* viewport */
#stage{flex:1 1 auto;position:relative;min-width:0;background:
  radial-gradient(120% 90% at 50% 8%, rgba(91,141,255,.10), transparent 60%), var(--bg)}
#canvasHost{position:absolute;inset:0}
#canvasHost canvas{display:block;width:100%;height:100%;outline:none}

/* floating tool column */
.tools{position:absolute;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
.tools .btn{background:color-mix(in srgb, var(--bg2) 80%, transparent);backdrop-filter:blur(6px)}
.views{position:absolute;top:12px;left:12px;display:flex;gap:6px;z-index:5;flex-wrap:wrap;max-width:60%}
.views .btn{background:color-mix(in srgb, var(--bg2) 80%, transparent);backdrop-filter:blur(6px);
  font-size:11.5px;padding:5px 9px}

/* hud */
.hud{position:absolute;left:12px;bottom:12px;z-index:5;display:flex;gap:6px;align-items:center;
  font-size:11px;color:var(--tx3);font-variant-numeric:tabular-nums}
.hud .pill{background:color-mix(in srgb, var(--bg2) 80%, transparent);border:1px solid var(--line);
  border-radius:20px;padding:2px 9px;backdrop-filter:blur(6px)}
.hud .pill.live{color:var(--tx);border-color:var(--accent)}
.hud .pill.warn{color:#ffd48a;border-color:#8a6a2a;background:#3a2c10cc}

/* overlays */
.overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:20;padding:20px;
  background:color-mix(in srgb, var(--bg) 72%, transparent);backdrop-filter:blur(3px);text-align:center}
.overlay.hide{display:none}
.card{max-width:440px;background:var(--panel);border:1px solid var(--line);border-radius:14px;
  padding:20px 22px;box-shadow:var(--shadow)}
.card h3{margin:0 0 8px;font-size:15px}
.card p{margin:0 0 10px;color:var(--tx2);font-size:12.5px;line-height:1.65}
.card p:last-child{margin-bottom:0}
.bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0%;background:var(--accent);transition:width .18s}
.dropzone{position:absolute;inset:10px;border:2px dashed var(--accent);border-radius:14px;z-index:30;
  display:grid;place-items:center;background:color-mix(in srgb, var(--accent) 10%, transparent);
  font-weight:600;pointer-events:none}
.dropzone.hide{display:none}

/* ---------- transport ---------- */
footer.transport{
  flex:0 0 auto;background:var(--bg2);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:10px;padding:9px 12px;flex-wrap:wrap;
}
.play{width:34px;height:34px;border-radius:9px;background:var(--accent);color:#fff;
  display:grid;place-items:center;flex:0 0 auto}
.play:hover{filter:brightness(1.1)}
.tl{flex:1 1 260px;display:flex;align-items:center;gap:10px;min-width:180px}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;flex:1 1 auto;height:20px;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:5px;background:var(--line2)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;
  background:var(--accent);margin-top:-4.5px;border:2px solid var(--bg2);cursor:pointer}
input[type=range]::-moz-range-track{height:5px;border-radius:5px;background:var(--line2)}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border:2px solid var(--bg2);border-radius:50%;
  background:var(--accent);cursor:pointer}
.time{font-size:11.5px;color:var(--tx2);font-variant-numeric:tabular-nums;white-space:nowrap;min-width:104px;text-align:right}
.clipname{font-size:12.5px;font-weight:600;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* mobile */
#asideToggle{display:none}
@media (max-width:820px){
  body{overflow:auto}
  #app{height:100dvh}
  aside{position:absolute;left:0;top:0;bottom:0;z-index:40;box-shadow:var(--shadow);transform:translateX(-100%);
    transition:transform .2s ease}
  aside.open{transform:none}
  #asideToggle{display:inline-flex}
  .views{max-width:72%}
  .views .btn{padding:4px 7px;font-size:11px}
  .title{font-size:13.5px}
  .sub{display:none}
  .time{min-width:88px;font-size:11px}
  .clipname{max-width:120px}
}
</style>
</head>
<body>
<div id="app">

  <header class="top">
    <div class="brand">
      <div class="logo">RPG</div>
      <div>
        <div class="title">Animation Pack Viewer</div>
        <div class="sub">360° turntable · drag to orbit · scroll to zoom</div>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="btn icon" id="asideToggle" title="Show clip list">☰</button>
    <select class="sel" id="packSel" title="Choose a pack"></select>
    <a class="btn" id="fabLink" href="#" target="_blank" rel="noopener" style="display:none">View on Fab ↗</a>
    <button class="btn icon" id="themeBtn" title="Light / dark">◐</button>
    <button class="btn icon" id="fsBtn" title="Fullscreen">⛶</button>
  </header>

  <main>
    <aside id="aside">
      <div class="ahead">
        <h2>Animations</h2>
        <span class="count" id="clipCount">0</span>
      </div>
      <input id="clipSearch" placeholder="Filter clips…" autocomplete="off">
      <div id="clipList"></div>
    </aside>

    <div id="stage">
      <div id="canvasHost"></div>

      <div class="views">
        <button class="btn" data-view="front">Front</button>
        <button class="btn" data-view="side">Side</button>
        <button class="btn" data-view="three">3/4</button>
        <button class="btn" data-view="top">Top</button>
        <button class="btn" data-view="reset" title="Reset framing (R)">Reset</button>
      </div>

      <div class="tools">
        <button class="btn icon on" id="spinBtn" title="Auto turntable (T)">↻</button>
        <button class="btn icon on" id="gridBtn" title="Grid &amp; floor (G)">▦</button>
        <button class="btn icon on" id="followBtn" title="Follow the character (F) — keeps a travelling clip in frame">◎</button>
        <button class="btn icon" id="boneBtn" title="Skeleton (B)">⛓</button>
        <button class="btn icon" id="shotBtn" title="Save a PNG">⤓</button>
      </div>

      <div class="hud">
        <span class="pill" id="hudClock">—</span>
      </div>

      <div class="dropzone hide" id="dropzone">Drop a .glb / .gltf to preview it</div>

      <div class="overlay hide" id="overlay">
        <div class="card">
          <h3 id="ovTitle">Loading…</h3>
          <p id="ovText"></p>
          <div class="bar" id="ovBar"><i></i></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="transport">
    <button class="play" id="playBtn" title="Play / pause (Space)">▶</button>
    <div class="clipname" id="clipName">—</div>
    <div class="tl">
      <input type="range" id="scrub" min="0" max="1000" value="0" step="1" title="Scrub">
      <span class="time" id="timeRead">0.00s · f0</span>
    </div>
    <button class="btn on" id="loopBtn" title="Loop">Loop</button>
    <select class="sel" id="speedSel" title="Playback speed" style="max-width:88px">
      <option value="0.25">0.25×</option>
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="1.5">1.5×</option>
      <option value="2">2×</option>
    </select>
  </footer>
</div>

<!-- If three.js never arrives (offline, blocked CDN, old browser without importmap
     support) say so instead of showing an empty box. -->
<script>
setTimeout(function () {
  if (window.__viewerReady) return;
  var o = document.getElementById('overlay');
  document.getElementById('ovTitle').textContent = 'The 3D engine did not load';
  document.getElementById('ovText').innerHTML =
    'This viewer pulls three.js from <code>cdn.jsdelivr.net</code>. ' +
    'Check the connection, or self-host three.js and update the two URLs in the import map.';
  document.getElementById('ovBar').style.display = 'none';
  o.classList.remove('hide');
}, 9000);
</script>

<!-- three.js is loaded from a CDN. To self-host, drop the three build next to
     this file and change the two URLs below to your local paths. -->
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>

<script type="module">
/* ==================================================================
   1) PACK LIST — this is the only part you normally edit.
   ------------------------------------------------------------------
   Export one .glb per pack from UE5 (Export > glTF 2.0) or Maya, put
   the .glb files in the "glb_file" folder beside this HTML, and list
   them here.
   Every animation inside the .glb shows up in the clip list by itself.

   id     : short key, also usable in the URL (?pack=swcombat)
   name   : label in the dropdown
   files  : list of .glb paths, relative to this file. The FIRST file
            brings the character; every file after it is opened for its
            animations only, so one export per move still gives you one
            clip list. To add a move: drop the .glb in glb_file and add
            one line here.
   url    : a single .glb, if the pack only has one file (same as files:[url])
   fps    : frame rate for the frame counter (60 unless you say otherwise)
   fab    : optional Fab product link, shown as a button
   up     : "y" (default) or "z" — use "z" if the model lies on its back
   scale  : multiplier if the export came in centimetres (try 0.01)
   ================================================================== */
const PACKS = [
  { id:'SwCombat', name:'Sword Combat', fps:60, fab:'', files: [
      'glb_file/RPG_AtkParry_C_all_UE5.glb',
      // one line per animation, e.g.
      // 'glb_file/RPG_Block_C_UE5.glb',
  ]},
  // a second pack in the dropdown looks like this:
  { id:'Normal', name:'Normal', fps:60, fab:'', files: [
      'glb_file/RPG_Idle_C_UE5.glb',
  //     'glb_file/RPG_Run_C_UE5.glb',
   ]},
];

/* Optional: rename ugly exported clip names for the list.
   e.g. { 'mixamo.com': 'Idle', 'Armature|Attack_01': 'Sword Attack 01' } */
const CLIP_LABELS = {};

/* ================================================================== */

import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
import { KTX2Loader } from 'three/addons/loaders/KTX2Loader.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const CDN = 'https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/';
const $ = (s) => document.querySelector(s);
let elTime = null, elClock = null;        // re-queried every frame before
const params = new URLSearchParams(location.search);

/* ---------- renderer / scene ---------- */
const host = $('#canvasHost');
const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
host.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.01, 2000);
camera.position.set(2.4, 1.7, 3.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.autoRotateSpeed = 1.1;
controls.minDistance = 0.15;
controls.maxDistance = 200;
controls.target.set(0, 0.9, 0);
controls.addEventListener('change', markDirty);

/* studio lighting: PBR environment + key light that casts the shadow */
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;
pmrem.dispose();

const key = new THREE.DirectionalLight(0xffffff, 2.1);
key.position.set(3.2, 5.4, 2.6);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.bias = -0.0008;
key.shadow.normalBias = 0.02;
scene.add(key);
scene.add(key.target);   // so the shadow can travel with a moving clip
scene.add(new THREE.DirectionalLight(0x9fb4ff, 0.35).translateX(-4).translateY(2).translateZ(-3));
scene.add(new THREE.HemisphereLight(0xdfe7ff, 0x1a1e29, 0.35));

/* floor: grid + shadow catcher (no visible plane, just the shadow) */
const floor = new THREE.Group();
const grid = new THREE.GridHelper(20, 40, 0x5b8dff, 0x39415a);
grid.material.transparent = true; grid.material.opacity = 0.35;
const catcher = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.ShadowMaterial({ opacity:0.32 }));
catcher.rotation.x = -Math.PI / 2;
catcher.receiveShadow = true;
floor.add(grid, catcher);
scene.add(floor);

/* ---------- state ---------- */
let modelRoot = null, mixer = null, skelHelper = null;
let clips = [], action = null, activeClip = -1;
let playing = true, looping = true, speed = 1;
let scrubbing = false;
let currentPack = null, radius = 1;
let loadToken = 0;                         // ignores a load you navigated away from
let follow = true, followNode = null;      // camera tracks a travelling clip
const clock = new THREE.Clock();

/* The viewer used to redraw at the monitor's full refresh rate forever, even
   parked on a paused frame — 165 fps of shadow-mapped redraw for a still
   image. Now a frame is drawn only when something moved. On a product page
   sitting in a background tab this is the difference between a hot fan and
   nothing at all. */
let dirty = true, hudDirty = true;
const markDirty = () => { dirty = true; hudDirty = true; };

/* ---------- loaders ---------- */
const gltfLoader = new GLTFLoader();
try {
  const draco = new DRACOLoader().setDecoderPath(CDN + 'libs/draco/gltf/');
  gltfLoader.setDRACOLoader(draco);
  const ktx2 = new KTX2Loader().setTranscoderPath(CDN + 'libs/basis/').detectSupport(renderer);
  gltfLoader.setKTX2Loader(ktx2);
} catch (e) { console.warn('Optional compression loaders unavailable', e); }

/* ---------- overlay helpers ---------- */
function overlay(title, text, progress) {
  $('#ovTitle').textContent = title;
  $('#ovText').innerHTML = text || '';
  $('#ovBar').style.display = (progress === undefined) ? 'none' : 'block';
  $('#ovBar').firstElementChild.style.width = ((progress || 0) * 100).toFixed(0) + '%';
  $('#overlay').classList.remove('hide');
}
const hideOverlay = () => $('#overlay').classList.add('hide');
$('#overlay').addEventListener('click', hideOverlay);   // click anywhere to dismiss and start orbiting

/* ---------- pack switching ---------- */
const packSel = $('#packSel');
PACKS.forEach((p, i) => {
  const o = document.createElement('option');
  o.value = p.id; o.textContent = p.name;
  packSel.appendChild(o);
});
packSel.addEventListener('change', () => loadPack(PACKS.find(p => p.id === packSel.value)));

function disposeModel() {
  followNode = null;
  if (skelHelper) { scene.remove(skelHelper); skelHelper = null; }
  if (mixer) { mixer.stopAllAction(); mixer.uncacheRoot(mixer.getRoot()); mixer = null; }
  if (modelRoot) {
    modelRoot.traverse(o => {
      if (o.isMesh) {
        o.geometry?.dispose();
        const mats = Array.isArray(o.material) ? o.material : [o.material];
        mats.forEach(m => {
          if (!m) return;
          for (const k in m) { const v = m[k]; if (v && v.isTexture) v.dispose(); }
          m.dispose();
        });
      }
    });
    scene.remove(modelRoot);
    modelRoot = null;
  }
  clips = []; action = null; activeClip = -1;
  renderClipList();
}

let lastBlobUrl = null;
function loadPack(pack, blobUrl) {
  if (!pack) return;
  // a dropped file's object URL pins the whole .glb in memory until revoked
  if (lastBlobUrl && lastBlobUrl !== blobUrl) { URL.revokeObjectURL(lastBlobUrl); lastBlobUrl = null; }
  if (blobUrl) lastBlobUrl = blobUrl;
  currentPack = pack;
  if (pack.id) packSel.value = pack.id;
  const fab = $('#fabLink');
  if (pack.fab) { fab.href = pack.fab; fab.style.display = ''; } else { fab.style.display = 'none'; }

  /* A pack is one .glb or a list of them. Extra files are opened only for
     their animations, which drive the first file's skeleton because the
     tracks address bones by name. */
  const urls = blobUrl ? [blobUrl]
             : (Array.isArray(pack.files) && pack.files.length ? pack.files
             : (pack.url ? [pack.url] : []));
  disposeModel();

  if (!urls.length) { placeholder(); return; }

  const token = ++loadToken;
  const skipped = [];
  const many = urls.length > 1;
  const note = (i) => many ? 'file ' + (i + 1) + ' of ' + urls.length : '';
  overlay('Loading ' + pack.name + '…', note(0), 0);

  const loadOne = (u, i) => new Promise((ok, no) => gltfLoader.load(u,
    (g) => ok(g),
    (ev) => { if (ev.total) overlay('Loading ' + pack.name + '…', note(i), ev.loaded / ev.total); },
    (e) => no({ e, url: u })));

  loadOne(urls[0], 0).then(async (gltf) => {
      // A newer load started while this one was in flight. Its meshes are
      // already on the GPU, so drop them explicitly - returning alone leaks.
      if (token !== loadToken) { disposeTree(gltf.scene); return; }
      modelRoot = gltf.scene || gltf.scenes[0];
      if (pack.scale) modelRoot.scale.setScalar(pack.scale);
      if (pack.up === 'z') modelRoot.rotation.x = -Math.PI / 2;

      modelRoot.traverse(o => {
        if (o.isMesh || o.isSkinnedMesh) {
          o.castShadow = true; o.receiveShadow = true;
          o.frustumCulled = false;                 // skinned meshes can pop otherwise
        }
      });
      hideExtraLODs(modelRoot);   // keep LOD0, hide LOD1+
      followNode = anchorNode(modelRoot);
      scene.add(modelRoot);

      frameModel();

      const seen = new Set();
      let all = nameClips(gltf.animations, urls[0], seen);

      for (let i = 1; i < urls.length; i++) {           // the animation-only files
        try {
          const extra = await loadOne(urls[i], i);
          disposeTree(extra.scene);                     // keep the clips, drop the mesh
          if (token !== loadToken) return;
          all = all.concat(nameClips(extra.animations, urls[i], seen));
        } catch (bad) {
          console.warn('Skipped ' + bad.url, bad.e);
          skipped.push(bad.url);
        }
      }
      if (token !== loadToken) return;
      hideOverlay();            // only once every file is in, so a multi-file
                                // pack keeps showing "file 2 of 3" while it loads

      // Clip order is deliberate, not alphabetical: it follows the order of
      // files[] above, and within each .glb the order the RobinPG addon wrote
      // them (its Animations list). Sorting here would override both.
      clips = all;
      mixer = clips.length ? new THREE.AnimationMixer(modelRoot) : null;
      renderClipList();
      if (skipped.length) {
        $('#clipName').textContent = skipped.length + ' file(s) failed to load — see the console';
      }

      if (clips.length) {
        const want = params.get('clip');
        const i = want ? Math.max(0, clips.findIndex(c => label(c.name).toLowerCase() === want.toLowerCase())) : 0;
        playClip(i);
      } else if (!skipped.length) {
        $('#clipName').textContent = 'No animation in this file';
      }
    })
    .catch((bad) => {
      const err = bad && bad.e ? bad.e : bad;
      const url = (bad && bad.url) || urls[0];
      console.error(err);
      /* Nine times out of ten the path is right and the page was just opened
         by double-clicking it: browsers refuse to read a .glb over file://.
         Say that instead of sending you off to check a correct path. */
      if (location.protocol === 'file:') {
        overlay('Open this through a local server',
          'The path is probably fine — browsers block reading <code>' + url + '</code> ' +
          'over <code>file://</code> for security.<br><br>' +
          'In this folder run <code>py -m http.server 8000</code> (or ' +
          '<code>npx serve</code>) and open <code>http://localhost:8000/' +
          location.pathname.split('/').pop() + '</code>.<br><br>' +
          'Dragging a <code>.glb</code> onto this panel works over file:// too.');
      } else {
        overlay('Could not load ' + pack.name,
          'Looked for <code>' + (url) + '</code>, relative to this HTML file.<br>' +
          'Check the path in the <code>PACKS</code> list near the top of ' +
          'PackViewer360_1.html, or drag a <code>.glb</code> onto this panel.');
      }
      placeholder(true);
    });
}

/* One export per move means the clip inside is often called the same thing
   as the file, or something generic. Give every clip a name you can tell
   apart in the list, falling back to the file name. */
const fileStem = (u) => decodeURIComponent(String(u).split(/[\\/]/).pop() || '')
  .replace(/\.(glb|gltf)$/i, '');

function nameClips(anims, url, seen) {
  return (anims || []).map((clip) => {
    let n = label(clip.name);
    if (!n || /^(clip|take ?0*\d+|mixamo\.com|animation ?0*\d*)$/i.test(n)) n = fileStem(url);
    let key = n.toLowerCase(), k = 2;
    while (seen.has(key)) { n = fileStem(url) + ' (' + k + ')'; key = n.toLowerCase(); k++; }
    seen.add(key);
    clip.name = n;
    return clip;
  });
}

/* the animation-only files still arrive with a whole character attached */
function disposeTree(root) {
  root?.traverse((o) => {
    if (!o.isMesh) return;
    o.geometry?.dispose();
    (Array.isArray(o.material) ? o.material : [o.material]).forEach((m) => {
      if (!m) return;
      Object.values(m).forEach((v) => v && v.isTexture && v.dispose());
      m.dispose();
    });
  });
}

/* stand-in so the viewer never looks broken before the GLBs are in place */
function placeholder(keepOverlay) {
  const g = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({ color:0x4a5570, metalness:.15, roughness:.55 });
  const add = (geo, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
    m.castShadow = m.receiveShadow = true; g.add(m); return m; };
  add(new THREE.CapsuleGeometry(0.19, 0.42, 6, 14), 0, 1.16, 0);   // torso
  add(new THREE.SphereGeometry(0.135, 20, 14), 0, 1.58, 0);        // head
  add(new THREE.CapsuleGeometry(0.06, 0.42, 4, 10), -0.27, 1.18, 0);
  add(new THREE.CapsuleGeometry(0.06, 0.42, 4, 10), 0.27, 1.18, 0);
  add(new THREE.CapsuleGeometry(0.08, 0.5, 4, 10), -0.11, 0.55, 0);
  add(new THREE.CapsuleGeometry(0.08, 0.5, 4, 10), 0.11, 0.55, 0);
  g.userData.idle = true;
  modelRoot = g; scene.add(g);
  frameModel();
  $('#clipName').textContent = 'Placeholder figure';
  if (!keepOverlay) {
    overlay('No model loaded yet',
      'Put your exports in the <code>glb_file</code> folder and list them in the <code>PACKS</code> array at the top of this file — ' +
      'or just drag a <code>.glb</code> in here to look at it now.');
  }
}

/* ---------- LOD cull ----------
   A UE skeletal-mesh export carries every LOD as its own node
   (SKM_Foo_LOD0 / _LOD1 / _LOD2). glTF has no LOD switching, so three.js
   draws all of them stacked on top of each other: triple the triangles and
   z-fighting on the surface. Keep LOD0, hide the rest. */
function hideExtraLODs(root) {
  const lodRe = /(^|[_\-. ])lod[_\-. ]?([0-9]+)$/i;
  let hidden = 0;
  root.traverse(o => {
    if (!(o.isMesh || o.isSkinnedMesh || o.children.length)) return;
    const m = lodRe.exec(String(o.name || '').trim());
    if (m && parseInt(m[2], 10) > 0) { o.visible = false; hidden++; }
  });
  return hidden;
}

/* ---------- framing ----------
   Where the character actually stands. A UE skeleton has its root (and
   ik_foot_root) at the origin, on the ground, so that is the true centre.
   The bounding-box centre is not: a held weapon or an A-pose arm drags it
   off to one side, which is what pushed the character off the grid. */
function anchorNode(root) {
  let top = null;
  root.traverse(o => {
    if (top || !(o.isSkinnedMesh && o.skeleton && o.skeleton.bones.length)) return;
    let b = o.skeleton.bones[0];
    while (b.parent && b.parent.isBone) b = b.parent;
    top = b;
  });
  return root.getObjectByName('ik_foot_root') || root.getObjectByName('root') || top;
}

function groundAnchor(root) {
  const node = anchorNode(root);
  if (!node) return null;
  root.updateWorldMatrix(true, true);
  return new THREE.Vector3().setFromMatrixPosition(node.matrixWorld);
}


/* Distance that fits a sphere of radius r in BOTH axes of the current
   viewport. The vertical fov alone is not enough: a narrow (or portrait)
   window crops the sides, which is what made the character overflow. */
function fitDistance(r) {
  const half = Math.tan((camera.fov * Math.PI / 180) / 2);
  const aspect = Math.max(0.0001, camera.aspect || 1);
  return Math.max(r / half, r / (half * aspect)) * 1.15;   // 1.15 = breathing room
}

function frameModel() {
  if (!modelRoot) return;
  const box = new THREE.Box3().setFromObject(modelRoot);
  if (!box.isEmpty()) {
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    const anchor = groundAnchor(modelRoot) || center;  // skeleton root, else box centre
    modelRoot.position.x -= anchor.x;
    modelRoot.position.z -= anchor.z;
    modelRoot.position.y -= box.min.y;                 // feet on the floor
    // half-diagonal: the sphere that certainly contains the whole box
    radius = size.length() * 0.5 || 1;
    controls.target.set(0, size.y * 0.5, 0);
    const d = fitDistance(radius);
    /* These used to be fixed at 0.15 / 200. A UE export in centimetres is
       ~180 units tall and needs to sit ~350 units back, so OrbitControls
       clamped the camera to 200 and the character filled the window. */
    controls.minDistance = Math.max(0.01, radius * 0.06);
    controls.maxDistance = d * 8;
    camera.near = Math.max(0.001, d / 500); camera.far = d * 60;
    camera.updateProjectionMatrix();
    floor.scale.setScalar(Math.max(0.25, radius / 1.6));
    const s = Math.max(2.2, radius * 2.6);
    key.shadow.camera.left = -s; key.shadow.camera.right = s;
    key.shadow.camera.top = s; key.shadow.camera.bottom = -s;
    key.shadow.camera.far = s * 6;
    key.shadow.camera.updateProjectionMatrix();
    key.position.set(s * .7, s * 1.2, s * .6);
    key.target.position.set(0, 0, 0);        // follow() moves this; a new model resets it
    key.target.updateMatrixWorld();
  }
  setView(params.get('view') || 'three');
}

function setView(which) {
  markDirty();
  const d = fitDistance(radius);
  const t = controls.target;
  const pos = {
    front: [0, t.y, d],
    side:  [d, t.y, 0.001],
    three: [d * 0.72, t.y + radius * 0.45, d * 0.72],
    top:   [0.001, t.y + d * 0.95, 0.001],
    reset: [d * 0.72, t.y + radius * 0.45, d * 0.72],
  }[which] || [d * 0.72, t.y + radius * 0.45, d * 0.72];
  camera.position.set(pos[0], pos[1], pos[2]);
  controls.update();
}
document.querySelectorAll('[data-view]').forEach(b =>
  b.addEventListener('click', () => setView(b.dataset.view)));

/* ---------- clips ---------- */
const label = (n) => CLIP_LABELS[n] || String(n || 'Clip').replace(/^(Armature\||mixamo\.com)/i, '').trim() || 'Clip';

function renderClipList() {
  const list = $('#clipList');
  const q = $('#clipSearch').value.trim().toLowerCase();
  list.innerHTML = '';
  $('#clipCount').textContent = clips.length;
  const shown = clips.map((c, i) => ({ c, i })).filter(({ c }) => !q || label(c.name).toLowerCase().includes(q));
  if (!shown.length) {
    list.innerHTML = '<div class="empty">' +
      (clips.length ? 'Nothing matches that filter.' :
       'No animations found yet. Every clip inside the .glb appears here automatically.') + '</div>';
    return;
  }
  shown.forEach(({ c, i }) => {
    const b = document.createElement('button');
    b.className = 'clip' + (i === activeClip ? ' on' : '');
    b.innerHTML = '<span class="nm"></span><span class="dur">' + c.duration.toFixed(2) + 's</span>';
    b.querySelector('.nm').textContent = label(c.name);
    b.addEventListener('click', () => { playClip(i); if (innerWidth <= 820) $('#aside').classList.remove('open'); });
    list.appendChild(b);
  });
}
$('#clipSearch').addEventListener('input', renderClipList);

function playClip(i) {
  if (!mixer || !clips[i]) return;
  mixer.stopAllAction();                 // no crossfade: a paused fade would freeze mid-blend
  activeClip = i;
  action = mixer.clipAction(clips[i]);
  action.reset();
  action.setLoop(looping ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
  action.clampWhenFinished = !looping;
  action.timeScale = speed;
  action.setEffectiveWeight(1).play();
  action.paused = !playing;
  mixer.update(0);                       // show frame 0 even while paused
  markDirty();
  $('#clipName').textContent = label(clips[i].name);
  $('#scrub').max = 1000;
  renderClipList();
}

/* ---------- follow ----------
   A clip with root motion (the parry walks ~4 m forward) leaves the frame
   within a second. This slides the orbit pivot AND the camera by the same
   amount, so the character stays put on screen while you keep whatever
   angle, zoom and turntable you had — the way mixamo previews behave.
   Only X and Z are tracked; following the vertical bob would seasick. */
const followV = new THREE.Vector3(), followD = new THREE.Vector3();
function updateFollow(dt) {
  if (!follow || !followNode || !modelRoot) return;
  followNode.getWorldPosition(followV);
  followD.set(followV.x - controls.target.x, 0, followV.z - controls.target.z);
  const dist = followD.length();
  if (dist < 1e-4) return;
  // a loop restart or a clip change teleports the character: snap, don't glide
  const k = dist > radius * 1.5 ? 1 : 1 - Math.exp(-dt * 7);
  followD.multiplyScalar(k);
  markDirty();
  controls.target.add(followD);
  camera.position.add(followD);
  key.position.add(followD);                 // keep the character inside
  key.target.position.set(followV.x, 0, followV.z);   // the shadow frustum
  key.target.updateMatrixWorld();
}

/* ---------- transport ---------- */
function setPlaying(v) {
  playing = v;
  markDirty();
  if (action) action.paused = !v;
  $('#playBtn').textContent = v ? '❚❚' : '▶';
}
$('#playBtn').addEventListener('click', () => setPlaying(!playing));
$('#loopBtn').addEventListener('click', (e) => {
  looping = !looping;
  e.currentTarget.classList.toggle('on', looping);
  if (action) {
    action.setLoop(looping ? THREE.LoopRepeat : THREE.LoopOnce, Infinity);
    action.clampWhenFinished = !looping;
    action.reset().play(); action.paused = !playing;
  }
});
$('#speedSel').addEventListener('change', (e) => {
  speed = parseFloat(e.target.value);
  if (action) action.timeScale = speed;
});
const scrub = $('#scrub');
const onScrub = () => {
  if (!action) return;
  const dur = clips[activeClip].duration || 1;
  action.time = (scrub.value / 1000) * dur;
  mixer.update(0);
  markDirty();
  readTime();
};
scrub.addEventListener('pointerdown', () => { scrubbing = true; });
scrub.addEventListener('change', () => { scrubbing = false; });
scrub.addEventListener('input', onScrub);
/* Releasing the handle outside the window used to leave `scrubbing` stuck on,
   which silently froze playback. Clear it on every plausible end-of-drag. */
['pointerup', 'pointercancel', 'lostpointercapture', 'mouseup', 'touchend', 'blur']
  .forEach(t => addEventListener(t, () => { scrubbing = false; }));

let lastTimeText = '';
function readTime() {
  elTime = elTime || $('#timeRead');
  if (!action || !clips[activeClip]) {
    if (lastTimeText !== '0.00s · f0') { elTime.textContent = lastTimeText = '0.00s · f0'; }
    return;
  }
  const dur = clips[activeClip].duration || 1;
  const t = THREE.MathUtils.clamp(action.time, 0, dur);
  const fps = (currentPack && currentPack.fps) || 60;
  const txt = t.toFixed(2) + 's · f' + Math.round(t * fps) + '/' + Math.round(dur * fps);
  if (txt !== lastTimeText) { elTime.textContent = lastTimeText = txt; }   // skip no-op DOM writes
  if (!scrubbing) scrub.value = Math.round((t / dur) * 1000);
}

/* ---------- toggles ---------- */
const toggle = (btn, fn) => $(btn).addEventListener('click', (e) => { fn(e.currentTarget.classList.toggle('on')); markDirty(); });
toggle('#spinBtn', (on) => controls.autoRotate = on);
controls.autoRotate = true;
toggle('#gridBtn', (on) => floor.visible = on);
toggle('#followBtn', (on) => follow = on);
toggle('#boneBtn', (on) => {
  if (on && modelRoot) {
    skelHelper = new THREE.SkeletonHelper(modelRoot);
    skelHelper.material.linewidth = 2;
    scene.add(skelHelper);
  } else if (skelHelper) { scene.remove(skelHelper); skelHelper = null; }
});
$('#shotBtn').addEventListener('click', () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = ((currentPack?.name || 'viewer') + '_' + ($('#clipName').textContent || '') )
    .replace(/[^\w\-]+/g, '_') + '.png';
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
});
$('#themeBtn').addEventListener('click', () => {
  const light = document.documentElement.getAttribute('data-theme') === 'light';
  document.documentElement.setAttribute('data-theme', light ? 'dark' : 'light');
  grid.material.color.set(light ? 0x5b8dff : 0x3b6fe0);
  markDirty();
});
$('#fsBtn').addEventListener('click', () => {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen?.();
});
$('#asideToggle').addEventListener('click', () => $('#aside').classList.toggle('open'));

/* keyboard */
addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  const fps = (currentPack && currentPack.fps) || 60;
  if (e.code === 'Space') { e.preventDefault(); setPlaying(!playing); }
  else if (e.key === 'r' || e.key === 'R') setView('reset');
  else if (e.key === 't' || e.key === 'T') $('#spinBtn').click();
  else if (e.key === 'g' || e.key === 'G') $('#gridBtn').click();
  else if (e.key === 'f' || e.key === 'F') $('#followBtn').click();
  else if (e.key === 'b' || e.key === 'B') $('#boneBtn').click();
  else if ((e.key === 'ArrowRight' || e.key === 'ArrowLeft') && action) {
    setPlaying(false);
    const dur = clips[activeClip].duration || 1;
    const step = (e.key === 'ArrowRight' ? 1 : -1) / fps;
    action.time = (action.time + step + dur) % dur;
    mixer.update(0); markDirty(); readTime();
  } else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    if (!clips.length) return;
    e.preventDefault();
    playClip((activeClip + (e.key === 'ArrowDown' ? 1 : clips.length - 1)) % clips.length);
  }
});

/* drag & drop a local glb */
const dz = $('#dropzone');
['dragenter', 'dragover'].forEach(t => $('#stage').addEventListener(t, (e) => {
  e.preventDefault(); dz.classList.remove('hide');
}));
['dragleave', 'drop'].forEach(t => $('#stage').addEventListener(t, (e) => {
  e.preventDefault(); if (t === 'dragleave' && e.relatedTarget) return; dz.classList.add('hide');
}));
$('#stage').addEventListener('drop', (e) => {
  const f = e.dataTransfer?.files?.[0];
  if (!f) return;
  if (!/\.(glb|gltf)$/i.test(f.name)) { overlay('Not a glTF file', 'Drop a <code>.glb</code> or <code>.gltf</code>.'); return; }
  hideOverlay();
  // keep the frame rate of the pack you were looking at; a dropped file carries none
  loadPack({ id:'', name:f.name, url:'', fps:(currentPack && currentPack.fps) || 60 },
           URL.createObjectURL(f));
});

/* ---------- resize & loop ---------- */
function resize() {
  const w = host.clientWidth || 1, h = host.clientHeight || 1;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  markDirty();
  // a narrower window crops the sides, so pull back far enough to keep the
  // whole model inside the frame (never pushes in on a deliberate zoom)
  if (modelRoot) {
    const need = fitDistance(radius);
    const dir = camera.position.clone().sub(controls.target);
    if (dir.length() < need) {
      controls.maxDistance = Math.max(controls.maxDistance, need * 8);
      camera.position.copy(controls.target).add(dir.setLength(need));
      controls.update();
    }
  }
}
new ResizeObserver(resize).observe(host);
resize();

let lastT = -1, stuck = 0;

/* One pill that always says what playback is really doing, so "is it even
   running?" is never a guess again. */
let lastClockText = '', lastClockClass = '';
function hudClock() {
  const el = elClock = elClock || $('#hudClock');
  if (!action || !clips[activeClip]) {
    if (lastClockText !== 'no clip') { el.textContent = lastClockText = 'no clip'; el.className = lastClockClass = 'pill'; }
    return;
  }
  const dur = clips[activeClip].duration || 1;
  const fps = (currentPack && currentPack.fps) || 60;
  const t = THREE.MathUtils.clamp(action.time, 0, dur);
  const head = scrubbing ? 'scrub' : (playing && !action.paused ? '▶' : '❚❚');
  let txt = head + ' f' + Math.round(t * fps) + '/' + Math.round(dur * fps) +
            ' · ' + t.toFixed(2) + 's';
  const cls = 'pill' + (stuck > 1.2 ? ' warn' : ' live');
  if (stuck > 1.2) {
    txt = '⚠ frozen (' +
      (!playing ? 'paused' : scrubbing ? 'scrub stuck' : action.paused ? 'action paused' :
       action.getEffectiveWeight() === 0 ? 'zero weight' : 'no time advance') + ')';
    el.title = 'Playback is not advancing. Press Space, or reload the page.';
  } else {
    el.title = 'Frame counter for the active clip.';
  }
  if (txt !== lastClockText) { el.textContent = lastClockText = txt; }
  if (cls !== lastClockClass) { el.className = lastClockClass = cls; }
}

let hudAccum = 0;
function tick() {
  const dt = clock.getDelta();
  const animating = !!(mixer && action && playing && !scrubbing);
  if (mixer && playing && !scrubbing) {
    if (action) action.paused = false;   // defensive: never leave it half-paused
    mixer.update(dt);
  }
  if (action && playing && !scrubbing) {
    if (Math.abs(action.time - lastT) < 1e-6) stuck += dt; else { stuck = 0; lastT = action.time; }
  } else { stuck = 0; lastT = action ? action.time : -1; }
  if (modelRoot?.userData.idle) {                        // placeholder breathing
    if (modelRoot.userData.baseY === undefined) modelRoot.userData.baseY = modelRoot.position.y;
    modelRoot.position.y = modelRoot.userData.baseY + Math.sin(performance.now() / 900) * 0.02;
    modelRoot.rotation.y += dt * 0.15;
    markDirty();
  }
  updateFollow(dt);

  // during playback the read-outs only need ~12 Hz (they were rewriting the
  // DOM 165 times a second); an explicit change repaints them immediately
  hudAccum += dt;
  if (animating ? hudAccum >= 0.08 : hudDirty) {
    readTime(); hudClock(); hudAccum = 0; hudDirty = false;
  }

  const moved = controls.update();      // true while damping or the turntable runs
  if (dirty || moved || animating) {
    renderer.render(scene, camera);
    dirty = false;
  }
  requestAnimationFrame(tick);
}
tick();

/* ---------- go ---------- */
const startId = params.get('pack');
loadPack(PACKS.find(p => p.id === startId) || PACKS[0]);
if (params.get('ui') === 'min') {                        // ?ui=min for small product-page embeds
  $('#aside').style.display = 'none';
  document.querySelector('header.top').style.display = 'none';
}
setPlaying(true);
window.__viewerReady = true;
</script>
</body>
</html>
